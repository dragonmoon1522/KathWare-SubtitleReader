<!-- KathWare Accessibility Player 3.0.0. Fuente: player-template.html + kwsr.voice.js. -->
<section id="kathware-local-player" aria-labelledby="kwp-title" data-version="3.0.0">
  <h2 id="kwp-title">Reproductor accesible de KathWare</h2>
  <p>Cargá un archivo de audio o video y subtítulos SRT o VTT desde tu dispositivo.</p>
  <style>
    #kathware-local-player { padding: .5rem; }
    #kathware-local-player #videoPlayer { display:block;width:100%;height:auto;max-height:65vh;object-fit:contain;background:#000;margin:1rem 0; }
    #kathware-local-player:fullscreen { box-sizing:border-box;background:#111;color:#fff;width:100%;height:100%;overflow:auto;padding:1rem; }
    #kathware-local-player:fullscreen #videoPlayer { max-height:55vh; }
    #kathware-local-player button { margin:4px; }
    #kathware-local-player label { display:block;margin-top:.75rem; }
    #kathware-local-player #progressBar { width:100%;max-width:900px; }
    #kathware-local-player :focus-visible { outline:3px solid #0782d4;outline-offset:3px; }
    #sub-accesible { position:fixed;left:0;top:0;width:1px;height:1px;overflow:hidden;clip:rect(1px,1px,1px,1px);clip-path:inset(50%);white-space:nowrap; }
  </style>
  <label for="videoInput">Archivo de video o audio:</label>
  <input type="file" id="videoInput" accept="video/*,audio/*">
  <label for="subtitleInput">Archivo de subtítulos (.vtt o .srt):</label>
  <input type="file" id="subtitleInput" accept=".vtt,.srt,text/vtt">
  <video id="videoPlayer" preload="metadata" playsinline></video>
  <label for="progressBar">Progreso:</label>
  <input type="range" id="progressBar" min="0" max="100" value="0" step="0.1" disabled>
  <span id="tiempoActual">00:00</span> / <span id="tiempoTotal">00:00</span>
  <span id="tiempoRestante">Restante: -00:00</span>
  <div class="controls" role="group" aria-label="Controles de reproducción">
    <button id="btnPlay" type="button" disabled>Reproducir</button>
    <button id="btnPause" type="button" disabled>Pausar</button>
    <button id="btnBack" type="button" disabled>Retroceder 10 segundos</button>
    <button id="btnForward" type="button" disabled>Avanzar 10 segundos</button>
    <button id="btnVolDown" type="button" disabled>Bajar volumen</button>
    <button id="btnVolUp" type="button" disabled>Subir volumen</button>
    <button id="btnMute" type="button" disabled>Silenciar</button>
    <button id="btnFullscreen" type="button" disabled>Pantalla completa</button>
  </div>
  <label for="modoNarrador">Modo de lectura:</label>
  <select id="modoNarrador" disabled>
    <option value="off">Desactivado</option>
    <option value="lector">Lector de pantalla</option>
    <option value="sintetizador">Voz del sistema</option>
  </select>
  <label for="kwp-voice">Voz del sintetizador:</label>
  <select id="kwp-voice"><option value="">Predeterminada del navegador</option></select>
  <label for="kwp-rate">Velocidad del sintetizador:</label>
  <select id="kwp-rate">
    <option value="0.8">0,8</option><option value="1">1</option><option value="1.25">1,25</option>
    <option value="1.5">1,5</option><option value="1.75" selected>1,75</option>
    <option value="2">2</option><option value="2.5">2,5</option><option value="3">3</option>
  </select>
  <p>La voz y velocidad del modo lector se configuran en tu lector de pantalla. Los botones de volumen ajustan el audio del archivo.</p>
  <p id="estadoPlayer" role="status" aria-live="polite">Estado: desactivado.</p>
  <div id="sub-accesible" aria-live="polite" aria-atomic="true" role="status"></div>
</section>
<script>
(() => {
  /* KATHWARE_SHARED_VOICE */
  function init() {
    if (window.__KATHWARE_LOCAL_PLAYER__) return;
    const root = document.getElementById('kathware-local-player');
    if (!root) return;
    const el = id => root.querySelector('#' + id);
    const video = el('videoPlayer'), mode = el('modoNarrador'), voiceSelect = el('kwp-voice'), rate = el('kwp-rate');
    const status = text => { el('estadoPlayer').textContent = text; };
    const app = {
      version: '3.0.0',
      state: { extensionActiva:true, modoNarradorGlobal:mode.value, currentVideo:video, liveRegion:el('sub-accesible') },
      CFG: { ttsStartTimeoutMs:10000, ttsWatchdogMs:15000, ttsRetryDelayMs:500, ttsMaxRetries:1, ttsRate:Number(rate.value) },
      toast: { notify:status }
    };
    installVoice(app);
    window.__KATHWARE_LOCAL_PLAYER__ = app;
    let mediaUrl = '', subsUrl = '', mediaReady = false, subsReady = false, track = null, loadId = 0;
    const playbackIds = ['btnPlay','btnPause','btnBack','btnForward','btnVolDown','btnVolUp','btnMute','btnFullscreen','progressBar'];
    const enable = () => {
      for (const id of playbackIds) el(id).disabled = !mediaReady;
      mode.disabled = !(mediaReady && subsReady);
    };
    const stop = () => app.voice.detenerLectura();
    const format = t => {
      t = Number.isFinite(t) ? Math.max(0,t) : 0;
      const h = Math.floor(t/3600), m = Math.floor(t/60)%60, s = Math.floor(t%60);
      return (h ? h + ':' : '') + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
    };
    const updateTime = () => {
      el('tiempoActual').textContent = format(video.currentTime);
      el('tiempoTotal').textContent = format(video.duration);
      el('tiempoRestante').textContent = 'Restante: -' + format(video.duration-video.currentTime);
      el('progressBar').value = Number.isFinite(video.duration) && video.duration > 0 ? video.currentTime/video.duration*100 : 0;
    };
    const readActive = () => {
      if (!subsReady || video.paused || video.ended) return;
      const texts = Array.from(track?.track?.activeCues || []).map(cue => {
        if (cue.getCueAsHTML) return cue.getCueAsHTML().textContent || '';
        return String(cue.text || '').replace(/<[^>]*>/g,' ');
      });
      const text = texts.join(' ').replace(/\s+/g,' ').trim();
      if (text) app.voice.leerTextoAccesible(text);
    };
    const clearTrack = () => {
      if (track?.track) track.track.oncuechange = null;
      track?.remove(); track = null; subsReady = false;
      if (subsUrl) URL.revokeObjectURL(subsUrl);
      subsUrl = '';
    };
    const refreshVoices = () => {
      const current = app.state.ttsVoiceURI || '';
      const voices = typeof speechSynthesis !== 'undefined' ? speechSynthesis.getVoices() : [];
      voiceSelect.textContent = '';
      const automatic = document.createElement('option');
      automatic.value = ''; automatic.textContent = 'Predeterminada del navegador'; voiceSelect.appendChild(automatic);
      for (const voice of voices) {
        const option = document.createElement('option'); option.value = voice.voiceURI || voice.name;
        option.textContent = voice.name + (voice.lang ? ' — ' + voice.lang : ''); voiceSelect.appendChild(option);
      }
      if (current && !voices.some(voice => (voice.voiceURI || voice.name) === current)) {
        const unavailable = document.createElement('option'); unavailable.value = current;
        unavailable.textContent = (app.state.ttsVoiceName || 'Voz elegida') + ' (no disponible)'; voiceSelect.appendChild(unavailable);
      }
      voiceSelect.value = current; app.voice.cargarVoz();
    };
    voiceSelect.onchange = () => {
      stop(); const voices = typeof speechSynthesis !== 'undefined' ? speechSynthesis.getVoices() : [];
      const selected = voices.find(voice => (voice.voiceURI || voice.name) === voiceSelect.value);
      app.state.ttsVoiceURI = voiceSelect.value; app.state.ttsVoiceName = selected?.name || '';
      app.voice.cargarVoz();
    };
    rate.onchange = () => { stop(); app.CFG.ttsRate = Number(rate.value); };
    mode.onchange = () => {
      stop(); app.state.modoNarradorGlobal = mode.value;
      if (mode.value === 'lector') app.voice.prepareLiveRegion();
      readActive();
    };
    el('videoInput').onchange = event => {
      const file = event.target.files[0]; if (!file) return;
      loadId++; stop(); video.pause(); clearTrack(); mediaReady = false; enable();
      if (mediaUrl) URL.revokeObjectURL(mediaUrl);
      mediaUrl = URL.createObjectURL(file); video.src = mediaUrl; video.load();
      status('Cargando archivo…');
    };
    el('subtitleInput').onchange = async event => {
      const file = event.target.files[0]; if (!file) return;
      const token = ++loadId;
      stop(); clearTrack(); enable();
      try {
        let text = (await file.text()).replace(/^\uFEFF/,'').replace(/\r\n?/g,'\n').trim();
        if (token !== loadId) return;
        if (!/^WEBVTT(?:\s|$)/.test(text)) text = 'WEBVTT\n\n' + text.replace(/(\d{2}:\d{2}:\d{2}),(\d{3})/g,'$1.$2');
        subsUrl = URL.createObjectURL(new Blob([text],{ type:'text/vtt' }));
        const current = document.createElement('track');
        current.kind = 'subtitles'; current.label = 'Subtítulos'; current.srclang = 'und'; current.default = true; current.src = subsUrl;
        track = current;
        current.onload = () => {
          if (current !== track || token !== loadId) return;
          subsReady = true; current.track.mode = 'showing'; current.track.oncuechange = readActive;
          enable(); status('Subtítulos cargados.'); readActive();
        };
        current.onerror = () => { if (current === track) { subsReady = false; enable(); status('No se pudo cargar la pista. Revisá el archivo SRT o VTT.'); } };
        video.appendChild(current); current.track.mode = 'showing';
      } catch { if (token === loadId) status('No se pudo leer el archivo de subtítulos.'); }
    };
    video.onloadedmetadata = () => { mediaReady = true; enable(); updateTime(); status('Archivo cargado.'); };
    video.onerror = () => { stop(); mediaReady = false; enable(); status('No se pudo reproducir este archivo. Revisá que el navegador admita su formato.'); };
    video.ontimeupdate = updateTime;
    video.onpause = stop; video.onseeking = stop; video.onended = stop; video.onplay = readActive;
    el('btnPlay').onclick = () => video.play().catch(() => status('No se pudo iniciar la reproducción.'));
    el('btnPause').onclick = () => video.pause();
    el('btnBack').onclick = () => { stop(); video.currentTime = Math.max(0,video.currentTime-10); };
    el('btnForward').onclick = () => { stop(); video.currentTime = Math.min(Number.isFinite(video.duration) ? video.duration : Infinity,video.currentTime+10); };
    el('btnVolDown').onclick = () => { video.volume = Math.max(0,video.volume-.1); };
    el('btnVolUp').onclick = () => { video.volume = Math.min(1,video.volume+.1); };
    el('btnMute').onclick = () => { video.muted = !video.muted; el('btnMute').textContent = video.muted ? 'Activar sonido' : 'Silenciar'; };
    el('btnFullscreen').onclick = () => {
      try {
        if (!root.requestFullscreen) { status('Este navegador no permite activar la pantalla completa de este reproductor.'); return; }
        root.requestFullscreen().catch(() => status('No se pudo activar la pantalla completa.'));
      } catch { status('No se pudo activar la pantalla completa.'); }
    };
    el('progressBar').oninput = () => { if (Number.isFinite(video.duration)) { stop(); video.currentTime = Number(el('progressBar').value)/100*video.duration; } };
    if (typeof speechSynthesis !== 'undefined') speechSynthesis.addEventListener?.('voiceschanged',refreshVoices);
    refreshVoices(); app.voice.prepareLiveRegion(); enable();
    window.addEventListener('pagehide',() => { stop(); if (mediaUrl) URL.revokeObjectURL(mediaUrl); if (subsUrl) URL.revokeObjectURL(subsUrl); });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded',init,{ once:true }); else init();
})();
</script>
